<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14">
  <rect width="960" height="620" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <style>
    .box   { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .zone  { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; stroke-dasharray: 6 4; }
    .title { fill: #0f172a; font-size: 15px; font-weight: 600; }
    .sub   { fill: #64748b; font-size: 11.5px; }
    .lbl   { fill: #64748b; font-size: 11.5px; }
    .flow  { stroke: #94a3b8; stroke-width: 1.5; fill: none; marker-end: url(#arr); }
    .flowA { stroke: #2563eb; stroke-width: 1.8; fill: none; marker-end: url(#arrA); }
    .badge { fill: #ffffff; stroke: #cbd5e1; font-size: 10.5px; }
    .free  { fill: #16a34a; font-size: 10.5px; font-weight: 600; }
    .paid  { fill: #d97706; font-size: 10.5px; font-weight: 600; }
  </style>

  <!-- ================= PHONE ZONE ================= -->
  <rect class="zone" x="20" y="150" width="150" height="320" rx="10"/>
  <text class="title" x="95" y="175" text-anchor="middle">Phone</text>

  <rect class="box" x="40" y="195" width="110" height="58" rx="8"/>
  <text class="title" x="95" y="218" text-anchor="middle" font-size="13">Telegram</text>
  <text class="sub" x="95" y="236" text-anchor="middle">voice notes in/out</text>

  <rect class="box" x="40" y="275" width="110" height="58" rx="8"/>
  <text class="title" x="95" y="298" text-anchor="middle" font-size="13">Tailscale</text>
  <text class="sub" x="95" y="316" text-anchor="middle">Android app</text>

  <rect class="box" x="40" y="390" width="110" height="58" rx="8"/>
  <text class="title" x="95" y="413" text-anchor="middle" font-size="13">Browser</text>
  <text class="sub" x="95" y="431" text-anchor="middle">passkey login</text>

  <!-- ================= TELEGRAM CLOUD ================= -->
  <rect class="box" x="230" y="195" width="130" height="58" rx="8"/>
  <text class="title" x="295" y="218" text-anchor="middle" font-size="13">Telegram API</text>
  <text class="sub" x="295" y="236" text-anchor="middle">long-polling, no ports</text>
  <text class="free" x="295" y="185" text-anchor="middle">free</text>

  <!-- ================= WINDOWS PC ZONE ================= -->
  <rect class="zone" x="420" y="20" width="250" height="580" rx="10"/>
  <text class="title" x="545" y="45" text-anchor="middle">Windows PC (24/7)</text>

  <!-- Tailscale on PC -->
  <rect class="box" x="445" y="275" width="200" height="58" rx="8"/>
  <text class="title" x="545" y="298" text-anchor="middle" font-size="13">Tailscale on PC</text>
  <text class="sub" x="545" y="316" text-anchor="middle">mesh VPN, MagicDNS</text>
  <text class="free" x="625" y="265" text-anchor="middle">free</text>

  <!-- Hermes gateway -->
  <rect class="box" x="445" y="120" width="200" height="110" rx="8" stroke="#2563eb" stroke-width="2"/>
  <text class="title" x="545" y="146" text-anchor="middle" font-size="13">Hermes Agent</text>
  <text class="sub" x="545" y="164" text-anchor="middle">gateway (schtasks autostart)</text>
  <text class="sub" x="545" y="180" text-anchor="middle">STT · agent loop · TTS · ffmpeg</text>
  <text class="sub" x="545" y="212" text-anchor="middle">config.yaml + .env</text>

  <!-- Pocket ID -->
  <rect class="box" x="445" y="380" width="200" height="58" rx="8"/>
  <text class="title" x="545" y="403" text-anchor="middle" font-size="13">Pocket ID</text>
  <text class="sub" x="545" y="421" text-anchor="middle">:1411 · passkey SSO</text>
  <text class="free" x="625" y="370" text-anchor="middle">free</text>

  <!-- Private apps -->
  <rect class="box" x="445" y="475" width="200" height="58" rx="8"/>
  <text class="title" x="545" y="498" text-anchor="middle" font-size="13">Private web apps</text>
  <text class="sub" x="545" y="516" text-anchor="middle">optional Caddy in front</text>
  <text class="free" x="625" y="465" text-anchor="middle">free</text>

  <!-- ================= CLOUD APIS (right) ================= -->
  <!-- Surplus -->
  <rect class="box" x="760" y="60" width="175" height="72" rx="8" stroke="#d97706" stroke-width="1.5"/>
  <text class="title" x="847" y="85" text-anchor="middle" font-size="13">Surplus Intelligence</text>
  <text class="sub" x="847" y="103" text-anchor="middle">LLM · deepseek-v4.1-flash</text>
  <text class="sub" x="847" y="119" text-anchor="middle">api.surplusintelligence.ai</text>
  <text class="paid" x="847" y="50" text-anchor="middle">prepaid by user</text>

  <!-- Groq -->
  <rect class="box" x="760" y="165" width="175" height="72" rx="8"/>
  <text class="title" x="847" y="190" text-anchor="middle" font-size="13">Groq</text>
  <text class="sub" x="847" y="208" text-anchor="middle">STT · whisper-large-v3-turbo</text>
  <text class="sub" x="847" y="224" text-anchor="middle">free tier (8 h audio/day)</text>
  <text class="free" x="847" y="155" text-anchor="middle">free</text>

  <!-- Edge TTS -->
  <rect class="box" x="760" y="270" width="175" height="58" rx="8"/>
  <text class="title" x="847" y="293" text-anchor="middle" font-size="13">Edge TTS</text>
  <text class="sub" x="847" y="311" text-anchor="middle">spoken replies, no key</text>
  <text class="free" x="847" y="260" text-anchor="middle">free</text>

  <!-- ================= EDGES ================= -->
  <!-- Phone -> Telegram API -->
  <path class="flowA" d="M150,224 H228"/>
  <text class="lbl" x="189" y="214" text-anchor="middle">voice note</text>

  <!-- Telegram API -> Hermes -->
  <path class="flowA" d="M360,224 C395,224 400,180 443,175"/>
  <text class="lbl" x="400" y="205" text-anchor="middle">updates</text>

  <!-- Phone Tailscale -> PC Tailscale -->
  <path class="flow" d="M150,304 H443"/>
  <text class="lbl" x="295" y="294" text-anchor="middle">WireGuard tunnel</text>

  <!-- PC Tailscale -> Hermes -->
  <path class="flow" d="M545,273 V232"/>
  <text class="lbl" x="560" y="258">tailscale serve --bg 1411</text>

  <!-- Phone browser -> Pocket ID via ts.net -->
  <path class="flow" d="M95,450 C95,505 250,470 443,420"/>
  <text class="lbl" x="240" y="487" text-anchor="middle">https://machine.tailnet.ts.net</text>

  <!-- Tailscale -> private apps -->
  <path class="flow" d="M645,409 C665,409 670,480 647,495"/>

  <!-- Hermes -> cloud APIs -->
  <path class="flow" d="M647,150 H758"/>
  <text class="lbl" x="702" y="140" text-anchor="middle">SURPLUS_API_KEY</text>

  <path class="flow" d="M647,165 C700,175 710,195 758,199"/>
  <text class="lbl" x="702" y="172" text-anchor="middle">GROQ_API_KEY</text>

  <path class="flow" d="M647,185 C700,220 710,280 758,296"/>
  <text class="lbl" x="712" y="262" text-anchor="middle">no key</text>

  <!-- Legend -->
  <rect class="badge" x="20" y="540" width="130" height="60" rx="8"/>
  <text class="free" x="35" y="563">free tier</text>
  <text class="paid" x="35" y="583">prepaid usage</text>
</svg>
