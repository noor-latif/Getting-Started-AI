<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 872" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13">
  <title id="t">Orchestrate your agent on-the-go: Hermes Agent architecture</title>
  <desc id="d">You send a voice note from Telegram on your phone. Telegram holds it until Hermes Agent on your PC pulls it down. Hermes sends the audio to a speech-to-text service, the text to an AI model, and the reply to a text-to-speech service. The spoken reply returns through Telegram to your phone. Hermes also builds and runs your private web apps, which sit behind Caddy and a Pocket ID passkey login and are reached from your phone over a Tailscale tunnel.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#3b82f6"/>
    </marker>
    <filter id="shadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <style>
    .bg      { fill: #f8fafc; }
    .card    { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; filter: url(#shadow); }
    .hero    { fill: #ecfdf5; stroke: #34d399; stroke-width: 2; filter: url(#shadow); }
    .chip    { fill: #f1f5f9; }
    .title   { fill: #0f172a; font-size: 21px; font-weight: 800; }
    .h       { fill: #0f172a; font-size: 15px; font-weight: 700; }
    .sub     { fill: #64748b; font-size: 12.5px; }
    .small   { fill: #64748b; font-size: 11px; }
    .num     { fill: #ffffff; font-size: 12px; font-weight: 700; }
    .pillF   { fill: #e2e8f0; }
    .pillP   { fill: #fde68a; }
    .txtF    { fill: #475569; font-size: 11px; font-weight: 700; }
    .txtP    { fill: #92400e; font-size: 11px; font-weight: 700; }
    .send    { stroke: #3b82f6; stroke-width: 3; stroke-linecap: round; fill: none; marker-end: url(#arrow); }
    .reply   { stroke: #3b82f6; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 2 7; fill: none; marker-end: url(#arrow); }
    .div     { stroke: #e2e8f0; stroke-width: 1.5; }
  </style>

  <rect class="bg" width="390" height="872" rx="18"/>

  <!-- Title -->
  <text x="195" y="46" text-anchor="middle" class="title">Orchestrate your agent</text>
  <text x="195" y="68" text-anchor="middle" class="sub">Hermes Agent + Telegram + private apps</text>
  <text x="195" y="90" text-anchor="middle" class="small">Solid arrow: you send  ·  Dotted arrow: it replies</text>

  <!-- Phone -->
  <rect class="card" x="24" y="108" width="342" height="64" rx="14"/>
  <text class="h" x="195" y="134" text-anchor="middle">Your phone</text>
  <text class="sub" x="195" y="154" text-anchor="middle">Telegram app: hold the mic and talk</text>

  <path class="send" d="M165,176 V200"/>
  <path class="reply" d="M225,200 V176"/>

  <!-- Telegram -->
  <rect class="card" x="24" y="204" width="342" height="64" rx="14"/>
  <text class="h" x="195" y="230" text-anchor="middle">Telegram servers (free)</text>
  <text class="sub" x="195" y="250" text-anchor="middle">Hold messages until your PC picks them up</text>

  <path class="send" d="M165,272 V296"/>
  <path class="reply" d="M225,296 V272"/>

  <!-- Hermes -->
  <rect class="hero" x="24" y="300" width="342" height="104" rx="14"/>
  <text class="h" x="195" y="328" text-anchor="middle">Hermes Agent on your PC</text>
  <text class="sub" x="195" y="351" text-anchor="middle">Always on, runs the voice loop</text>
  <text class="sub" x="195" y="371" text-anchor="middle">Outbound only, no open ports</text>
  <text class="sub" x="195" y="391" text-anchor="middle">Builds and runs your private apps</text>

  <path class="send" d="M165,408 V432"/>
  <path class="reply" d="M225,432 V408"/>

  <!-- Cloud voice services -->
  <rect class="card" x="24" y="436" width="342" height="206" rx="14"/>
  <text class="h" x="195" y="464" text-anchor="middle">Cloud voice services</text>

  <circle cx="52" cy="503" r="13" fill="#3b82f6"/>
  <text class="num" x="52" y="507.5" text-anchor="middle">1</text>
  <text class="h" x="76" y="501">Ears</text>
  <text class="sub" x="76" y="518">Groq · whisper-large-v3-turbo</text>
  <rect class="pillF" x="300" y="491" width="48" height="22" rx="11"/>
  <text class="txtF" x="324" y="506" text-anchor="middle">FREE</text>
  <line class="div" x1="40" y1="530" x2="350" y2="530"/>

  <circle cx="52" cy="557" r="13" fill="#3b82f6"/>
  <text class="num" x="52" y="561.5" text-anchor="middle">2</text>
  <text class="h" x="76" y="555">Brain</text>
  <text class="sub" x="76" y="572">Surplus · deepseek-v4.1-flash</text>
  <rect class="pillP" x="300" y="545" width="48" height="22" rx="11"/>
  <text class="txtP" x="324" y="560" text-anchor="middle">PAID</text>
  <line class="div" x1="40" y1="584" x2="350" y2="584"/>

  <circle cx="52" cy="605" r="13" fill="#3b82f6"/>
  <text class="num" x="52" y="609.5" text-anchor="middle">3</text>
  <text class="h" x="76" y="603">Voice</text>
  <text class="sub" x="76" y="620">Edge TTS · Microsoft voices</text>
  <rect class="pillF" x="300" y="593" width="48" height="22" rx="11"/>
  <text class="txtF" x="324" y="608" text-anchor="middle">FREE</text>

  <!-- Private apps -->
  <g transform="translate(0,22)">
  <rect class="card" x="24" y="660" width="342" height="128" rx="14"/>
  <text class="h" x="195" y="688" text-anchor="middle">Your private apps</text>
  <text class="sub" x="195" y="707" text-anchor="middle">Built by Hermes, reached from your phone</text>

  <rect class="chip" x="37" y="722" width="100" height="50" rx="10"/>
  <text class="h" x="87" y="743" text-anchor="middle" font-size="13">Caddy</text>
  <text class="small" x="87" y="760" text-anchor="middle">Proxy, optional</text>

  <rect class="chip" x="145" y="722" width="100" height="50" rx="10"/>
  <text class="h" x="195" y="743" text-anchor="middle" font-size="13">Pocket ID</text>
  <text class="small" x="195" y="760" text-anchor="middle">Passkey login</text>

  <rect class="chip" x="253" y="722" width="100" height="50" rx="10"/>
  <text class="h" x="303" y="743" text-anchor="middle" font-size="13">Tailscale</text>
  <text class="small" x="303" y="760" text-anchor="middle">Private tunnel</text>

  <!-- Notes -->
  <text x="195" y="818" text-anchor="middle" class="small">Voice replies: send a voice note, then type /voice on</text>
  <text x="195" y="836" text-anchor="middle" class="small">Round voice bubbles need ffmpeg installed</text>
  </g>
</svg>
